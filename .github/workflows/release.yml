name: Release

# Manual only: builds the installable zip and attaches it to the GitHub release of the
# version in addon.xml (tag v<version>, created if missing).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          ID=plugin.video.landschleicher
          VERSION=$(sed -n 's/.*<addon id="[^"]*" name="[^"]*" version="\([^"]*\)".*/\1/p' addon.xml)
          mkdir -p "dist/$ID"
          git archive HEAD | tar -x -C "dist/$ID"
          rm -rf "dist/$ID/tests" "dist/$ID/.github" "dist/$ID/.gitignore"
          (cd dist && zip -qr "$ID-$VERSION.zip" "$ID")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=dist/$ID-$VERSION.zip" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$ZIP" --clobber
          else
            gh release create "v$VERSION" "$ZIP" --target "$GITHUB_SHA" --title "$VERSION" --notes "See CHANGELOG.md"
          fi
